name: Publicar notas programadas

# Llama al publicador del sitio cada 5 minutos (ADR 0007). Vercel Hobby sólo permite crons
# diarios; GitHub Actions es gratis para esto. GitHub puede atrasar las ejecuciones
# programadas unos minutos en horas de mucha carga.
#
# Se activa al definir en el repositorio (Settings → Secrets and variables → Actions):
#   - Secret   CRON_SECRET: el mismo valor que en Vercel.
#   - Variable SITE_URL:    https://tu-proyecto.vercel.app (sin barra final).
# Mientras falte alguno, el job termina sin hacer nada.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicar-programadas
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar al publicador
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "Falta CRON_SECRET o SITE_URL: el publicador no está configurado todavía."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/publish-scheduled"
