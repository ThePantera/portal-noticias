# TEMPORAL: muestra en el log lo que cambiaría Prettier (la sesión no puede instalar dependencias). Se borra antes de mergear.
name: tmp formato
on: pull_request
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write . && git --no-pager diff
