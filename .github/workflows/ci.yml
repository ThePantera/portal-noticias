name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal_ci
          POSTGRES_DB: portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://portal:portal_ci@localhost:5432/portal_ci
      TEST_DATABASE_URL: postgresql://portal:portal_ci@localhost:5432/portal_test
      E2E_DATABASE_URL: postgresql://portal:portal_ci@localhost:5432/portal_e2e
      SITE_URL: http://localhost:3000
      SITE_NAME: Portal Noticias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar esquema y aplicar migraciones
        run: |
          npm run db:validate
          npm run db:deploy
      - name: Sin diferencias entre esquema y base
        run: |
          diff_sql=$(npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script)
          echo "$diff_sql"
          echo "$diff_sql" | grep -q "This is an empty migration"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Seeds (dos veces, para comprobar que son idempotentes)
        run: |
          npm run db:seed && npm run db:seed
          npm run db:seed:demo && npm run db:seed:demo
      - run: npm test
      - name: Crear bases de tests
        run: |
          PGPASSWORD=portal_ci psql -h localhost -U portal -d portal_ci -c 'CREATE DATABASE portal_test'
          PGPASSWORD=portal_ci psql -h localhost -U portal -d portal_ci -c 'CREATE DATABASE portal_e2e'
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - name: Tests end to end (compila y levanta el servidor de producción)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
